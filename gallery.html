    <style>
        :root {
            --page-bg: #f3f0e9;
            --page-bg-2: #ece7dc;
            --panel: rgba(255, 252, 246, 0.86);
            --panel-strong: rgba(255, 252, 246, 0.96);
            --border: rgba(49, 58, 70, 0.16);
            --text: #24303d;
            --muted: #5f6975;
            --accent: #344a5f;
            --accent-2: #7a6245;
            --accent-3: #a28a68;
            --shadow: 0 18px 52px rgba(33, 39, 46, 0.10);
            --shadow-soft: 0 10px 28px rgba(33, 39, 46, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            font-family: "Inter", Arial, sans-serif;
            line-height: 1.75;
            background:
                radial-gradient(circle at 14% 8%, rgba(122, 98, 69, 0.08), transparent 28%),
                radial-gradient(circle at 88% 4%, rgba(52, 74, 95, 0.08), transparent 30%),
                linear-gradient(180deg, var(--page-bg) 0%, var(--page-bg-2) 52%, var(--page-bg) 100%);
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: all 0.28s ease;
        }

        a:hover {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 1240px;
        }

        /* Hero banner */
        .banner-blog {
            position: relative;
            min-height: 405px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 88px 24px 110px;
            isolation: isolate;
            overflow: hidden;
            background:
                linear-gradient(135deg, rgba(31, 42, 54, 0.90), rgba(48, 57, 69, 0.82)),
                url("images/banner-bg.jpg") center center / cover no-repeat;
        }

        .banner-blog::before,
        .banner-blog::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        .banner-blog::before {
            width: 430px;
            height: 430px;
            left: -120px;
            top: -150px;
            background: radial-gradient(circle, rgba(198, 182, 153, 0.18), transparent 70%);
        }

        .banner-blog::after {
            width: 520px;
            height: 520px;
            right: -180px;
            bottom: -230px;
            background: radial-gradient(circle, rgba(215, 207, 192, 0.12), transparent 70%);
        }

        .banner-caption {
            width: min(900px, 100%);
            padding: 46px 34px;
            border: 1px solid rgba(244, 239, 229, 0.22);
            border-radius: 34px;
            background: rgba(25, 33, 43, 0.40);
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.22);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .banner-caption h1 {
            margin: 0 0 18px;
            color: #f8f4eb;
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(3rem, 7vw, 5.6rem);
            line-height: 1.04;
            letter-spacing: -0.03em;
            font-weight: 900;
            text-shadow: none;
        }

        .bread-crumb {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 0 !important;
            padding: 11px 18px;
            border-radius: 999px;
            border: 1px solid rgba(244, 239, 229, 0.22);
            background: rgba(255, 250, 240, 0.08);
            color: rgba(248, 244, 235, 0.82);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .bread-crumb a {
            color: #f8f4eb;
        }

        .bread-crumb a + a::before {
            content: "•";
            display: inline-block;
            margin-right: 12px;
            color: rgba(231, 219, 198, 0.90);
        }

        .bread-crumb a:hover {
            color: #efe2ca;
            transform: translateY(-1px);
        }

        /* Gallery */
        .gallery {
            position: relative;
            z-index: 2;
            margin-top: -56px;
            padding: 0 0 100px;
        }

        .gallery-shell {
            padding: 34px;
            border: 1px solid var(--border);
            border-radius: 40px;
            background: rgba(255, 252, 246, 0.78);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .gallery-masonry {
            column-count: 3;
            column-gap: 22px;
        }

        .gallery-item {
            display: inline-block;
            width: 100%;
            margin: 0 0 22px;
            break-inside: avoid;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid rgba(49, 58, 70, 0.16);
            background: rgba(255, 252, 246, 0.96);
            box-shadow: var(--shadow-soft);
            transition:
                transform 0.32s ease,
                border-color 0.32s ease,
                box-shadow 0.32s ease;
            cursor: zoom-in;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            border-color: rgba(52, 74, 95, 0.30);
            box-shadow: 0 20px 44px rgba(33, 39, 46, 0.14);
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.55s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.025);
        }

        .gallery-lightbox {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 34px;
            background: rgba(10, 16, 24, 0.90);
        }

        .gallery-lightbox.is-open {
            display: flex;
        }

        .gallery-lightbox img {
            max-width: 92vw;
            max-height: 92vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.42);
        }

        .gallery-lightbox button {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
        }

        @media (max-width: 991px) {
            .banner-blog {
                min-height: 380px;
                padding: 74px 18px 96px;
            }

            .banner-caption {
                padding: 36px 24px;
                border-radius: 28px;
            }

            .gallery {
                margin-top: -42px;
                padding-bottom: 78px;
            }

            .gallery-shell {
                padding: 24px;
                border-radius: 32px;
            }

            .gallery-masonry {
                column-count: 2;
                column-gap: 18px;
            }

            .gallery-item {
                margin-bottom: 18px;
                border-radius: 22px;
            }
        }

        @media (max-width: 767px) {
            .banner-blog {
                min-height: 320px;
            }

            .banner-caption h1 {
                font-size: clamp(2.7rem, 13vw, 4rem);
            }

            .bread-crumb {
                width: 100%;
                gap: 8px;
                font-size: 0.88rem;
            }

            .gallery {
                padding-bottom: 70px;
            }

            .gallery-shell {
                padding: 16px;
                border-radius: 26px;
            }

            .gallery-masonry {
                column-count: 1;
                column-gap: 0;
            }

            .gallery-item {
                margin-bottom: 16px;
                border-radius: 20px;
            }
        }
    </style>
</head>

    <div class="gallery-lightbox" aria-hidden="true">
        <button type="button" aria-label="Close gallery image">&times;</button>
        <img src="" alt="">
    </div>

    <script>
        (function() {
            var lightbox = document.querySelector('.gallery-lightbox');
            var lightboxImage = lightbox.querySelector('img');
            var closeButton = lightbox.querySelector('button');

            function openLightbox(image) {
                lightboxImage.src = image.src;
                lightboxImage.alt = image.alt || '';
                lightbox.classList.add('is-open');
                lightbox.setAttribute('aria-hidden', 'false');
            }

            function closeLightbox() {
                lightbox.classList.remove('is-open');
                lightbox.setAttribute('aria-hidden', 'true');
                lightboxImage.src = '';
            }

            document.querySelectorAll('.gallery-item img').forEach(function(image) {
                image.addEventListener('click', function() {
                    openLightbox(image);
                });
            });

            closeButton.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', function(event) {
                if (event.target === lightbox) {
                    closeLightbox();
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && lightbox.classList.contains('is-open')) {
                    closeLightbox();
                }
            });
        }());
    </script>
